<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
    integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css"
    integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <title>Tushar Prakash</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">

  <style>
    .badge-award{
      display:inline-block; margin-left:6px; padding:1px 7px;
      font-size:.68rem; font-weight:700; letter-spacing:.4px;
      color:#7a5200; background:#fbf2da; border:1px solid #e2c879; border-radius:3px;
      vertical-align:middle;
    }
    .pub-item{ margin-bottom:3em; }
    .profile-links a{ margin-right:5px; }
    .bibtex-toggle{ margin-left:-6px; margin-top:-2px; }
  </style>
</head>

<body>
  <div class="container">
    <div class="row">
      <div class="col-md-1"></div>
      <div class="col-md-10">

        <div class="row" style="margin-top: 3em;">
          <div class="col-sm-12" style="margin-bottom: 1em;">
            <h3 class="display-4" style="text-align: center;" id="site-name"></h3>
          </div>
          <br>
          <div class="col-md-10">
            <p id="bio"></p>
            <p id="interests"></p>
            <p id="contact-note"></p>
            <p class="profile-links" id="profile-links"></p>
          </div>
          <div class="col-md-2">
            <img id="profile-photo" class="img-thumbnail" width="280px" alt="Profile picture">
          </div>
        </div>

        <div class="row" style="margin-top: 1em;">
          <div class="col-sm-12">
            <h4>Publications</h4>
            <div id="publications"></div>
          </div>
        </div>

        <div class="row" style="margin-top: 3em; margin-bottom: 1em;">
          <div class="col-sm-12">
            <h4>Homepage Template</h4>
            <p>
              Feel free to use this website as a template! It is fully responsive and very easy to use and
              maintain &mdash; just edit <code>data.js</code> to add papers and links.
              <a href="https://github.com/theTushar-dot/my_webpage" target="_blank">Checkout the github repository for instructions on how to use it</a>.
              <br>
              <span id="webring"></span>
            </p>
            <div class="text-center mt-4" id="visitor-map"></div>
          </div>
        </div>

      </div>
      <div class="col-md-1"></div>
    </div>
  </div>

  <!-- 1) your content -->
  <script src="data.js"></script>
  <!-- 2) the renderer (you don't need to edit this) -->
  <script>
    (function () {
      var esc = function (s) {
        return String(s)
          .replace(/&(?![a-zA-Z#0-9]+;)/g, "&amp;")
          .replace(/</g, "&lt;").replace(/>/g, "&gt;");
      };

      // --- header ---
      document.getElementById("site-name").innerHTML =
        '<span style="font-weight:bold;">' + esc(profile.firstName) + "</span> " + esc(profile.lastName);
      document.getElementById("bio").innerHTML = profile.bioHtml;
      if (profile.researchInterestsHtml) {
        document.getElementById("interests").innerHTML =
        '<b>Research Interests:</b> ' + profile.researchInterestsHtml;}
      document.getElementById("contact-note").textContent = profile.contactNote || "";
      document.getElementById("profile-photo").src = profile.photo;

      // --- profile links + awards toggle ---
      var linksHtml = links.map(function (l) {
        return '<a href="' + l.url + '" target="_blank"><i class="' + l.icon + ' fa-lg"></i> ' + esc(l.label) + "</a>";
      }).join(" ");
      if (profile.awardsHtml) {
        linksHtml +=
          ' <button class="btn btn-link bibtex-toggle" data-toggle-target="awards-box" type="button">' +
          '<i class="fa-solid fa-trophy"></i> Awards</button>' +
          '<div id="awards-box" style="display:none;"><span style="font-weight:bold;">Awards:</span> ' +
          profile.awardsHtml + "</div>";
      }
      document.getElementById("profile-links").innerHTML = linksHtml;

      // --- publications ---
      var authorList = function (authors) {
        return authors.map(function (a) {
          if (a.me) return '<span style="font-weight:bold;">' + esc(a.name) + "</span>";
          if (a.url) return '<a href="' + a.url + '" target="_blank">' + esc(a.name) + "</a>";
          return esc(a.name);
        }).join(", ");
      };

      var pubsHtml = publications.map(function (p, i) {
        var bibId = "bib-" + i;
        var titleInner = esc(p.title);
        if (p.paper) titleInner = '<a href="' + p.paper + '" target="_blank">' + titleInner + "</a>";
        if (p.badge) titleInner += '<span class="badge-award">' + esc(p.badge) + "</span>";
        if (p.isNew) titleInner += '<span class="new-tag">NEW</span>';

        var actions = [];
        if (p.project) actions.push('<a href="' + p.project + '" target="_blank">Project Page</a>');
        if (p.paper)   actions.push('<a href="' + p.paper + '" target="_blank">Paper</a>');
        var actionsHtml = actions.join(" / ");
        if (actionsHtml) actionsHtml += " / ";
        if (p.bibtex) {
          actionsHtml +=
            '<button class="btn btn-link bibtex-toggle" type="button" data-toggle-target="' + bibId + '">Expand bibtex</button>' +
            '<div id="' + bibId + '" style="display:none;"><div class="card card-body"><pre><code>' +
            esc(p.bibtex) + "</code></pre></div></div>";
        }

        return (
          '<div class="pub-item"><div class="row">' +
            '<div class="col-sm-3"><img src="' + p.image + '" class="img-fluid img-thumbnail" alt="' + esc(p.title) + '"></div>' +
            '<div class="col-sm-9">' +
              titleInner + " <br>" +
              authorList(p.authors) + " <br>" +
              '<span style="font-style:italic;">' + p.venue + "</span>, " + p.year + " <br>" +
              actionsHtml +
            "</div>" +
          "</div></div>"
        );
      }).join("");
      document.getElementById("publications").innerHTML = pubsHtml;

      // --- webring ---
      if (typeof webring !== "undefined" && webring.length) {
        document.getElementById("webring").innerHTML = webring.map(function (u) {
          return '<a href="' + u + '" target="_blank">&#9883;</a>';
        }).join(" ");
      }

      // --- visitor map ---
      if (typeof visitorMap !== "undefined" && visitorMap) {
        document.getElementById("visitor-map").innerHTML =
          '<a href="' + visitorMap.href + '" title="Visit tracker" target="_blank">' +
          '<img src="' + visitorMap.img + '" alt="Visitor map"></a>';
      }

      // --- one tiny toggle handler for every collapsible (awards + all bibtex) ---
      document.addEventListener("click", function (e) {
        var btn = e.target.closest("[data-toggle-target]");
        if (!btn) return;
        var box = document.getElementById(btn.getAttribute("data-toggle-target"));
        if (box) box.style.display = (box.style.display === "none" ? "block" : "none");
      });
    })();
  </script>
</body>

</html>
